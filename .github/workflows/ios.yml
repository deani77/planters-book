name: iOS simulator build
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: iOS build and checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Check production calculations
        run: |
          cat ios/Selendang3/ProductionData.swift ios/Tests/ProductionChecks.swift > "$RUNNER_TEMP/ProductionChecks.swift"
          swift "$RUNNER_TEMP/ProductionChecks.swift"
      - name: Check estate reference validation
        run: |
          cat ios/Selendang3/ProductionData.swift ios/Selendang3/EstateReference.swift ios/Selendang3/EstateDashboardData.swift ios/Tests/EstateReferenceChecks.swift > "$RUNNER_TEMP/EstateReferenceChecks.swift"
          swift "$RUNNER_TEMP/EstateReferenceChecks.swift"
      - name: Check dashboard calculations
        run: |
          cat ios/Selendang3/ProductionData.swift ios/Selendang3/EstateReference.swift ios/Selendang3/EstateDashboardData.swift ios/Selendang3/CropProductionTableData.swift ios/Tests/EstateDashboardChecks.swift > "$RUNNER_TEMP/EstateDashboardChecks.swift"
          swift "$RUNNER_TEMP/EstateDashboardChecks.swift"
      - name: Check crop history
        run: |
          cat ios/Selendang3/ProductionData.swift ios/Selendang3/EstateReference.swift ios/Selendang3/EstateDashboardData.swift ios/Tests/CropHistoryChecks.swift > "$RUNNER_TEMP/CropHistoryChecks.swift"
          swift "$RUNNER_TEMP/CropHistoryChecks.swift"
      - name: Check Planter Tools calculations
        run: |
          cat ios/Selendang3/PlanterCalculations.swift ios/Tests/PlanterToolsChecks.swift > "$RUNNER_TEMP/PlanterToolsChecks.swift"
          swift "$RUNNER_TEMP/PlanterToolsChecks.swift"
      - name: Check XLSX imports and rejected data
        run: |
          workbook_checks_dir="$RUNNER_TEMP/planters-workbook-checks"
          mkdir -p "$workbook_checks_dir/Sources/WorkbookChecks"
          cp ios/Tests/WorkbookChecks.Package.swift "$workbook_checks_dir/Package.swift"
          cp ios/Selendang3/ProductionData.swift ios/Selendang3/EstateReference.swift ios/Selendang3/EstateDashboardData.swift ios/Selendang3/EstateXlsx.swift "$workbook_checks_dir/Sources/WorkbookChecks/"
          cp ios/Tests/EstateXlsxChecks.swift "$workbook_checks_dir/Sources/WorkbookChecks/main.swift"
          swift run --package-path "$workbook_checks_dir" WorkbookChecks
      - name: Check ZIP updates, backup and restore
        run: |
          zip_checks_dir="$RUNNER_TEMP/planters-zip-checks"
          mkdir -p "$zip_checks_dir/Sources/WorkbookChecks"
          cp ios/Tests/WorkbookChecks.Package.swift "$zip_checks_dir/Package.swift"
          cp ios/Selendang3/ProductionData.swift ios/Selendang3/EstateReference.swift ios/Selendang3/EstateDashboardData.swift ios/Selendang3/EstateXlsx.swift ios/Selendang3/EstateZip.swift ios/Selendang3/EstateReferenceStore.swift "$zip_checks_dir/Sources/WorkbookChecks/"
          cp ios/Tests/EstateZipChecks.swift "$zip_checks_dir/Sources/WorkbookChecks/main.swift"
          swift run --package-path "$zip_checks_dir" WorkbookChecks
      - name: Check offline compatibility packager
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/Selendang3.xcodeproj -scheme Selendang3 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build


