services:
  https:
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      ESTATE_DOMAIN: ${ESTATE_DOMAIN:?Set the public hostname}
    volumes:
      - /etc/s3-estate/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/s3-estate-tls/data:/data
      - /var/lib/s3-estate-tls/config:/config
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
