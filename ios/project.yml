name: Selendang3
options:
  preGenCommand: sips -s format png Artwork/S3.jpg --out Selendang3/Assets.xcassets/AppIcon.appiconset/AppIcon.png
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: 40
targets:
  Selendang3:
    type: application
    platform: iOS
    sources:
      - Selendang3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selendang3.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planters Book
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ZIPFoundation
    scheme: {}
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20


